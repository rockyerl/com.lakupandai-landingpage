<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" fill="none">
  <!-- Background -->
  <rect width="1200" height="630" fill="#0E1E30"/>
  
  <!-- Subtle Grids -->
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="rgba(255, 255, 255, 0.04)" stroke-width="1"/>
    </pattern>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DBC977" />
      <stop offset="100%" stop-color="#A66A2C" />
    </linearGradient>
    <radialGradient id="ambientGlow" cx="50%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#0056AA" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0056AA" stop-opacity="0" />
    </radialGradient>
  </defs>

  <rect width="1200" height="630" fill="url(#grid)" />
  <circle cx="950" cy="200" r="400" fill="url(#ambientGlow)" />
  <circle cx="150" cy="500" r="300" fill="#1D3451" fill-opacity="0.3" />

  <!-- Outer Border -->
  <rect x="24" y="24" width="1152" height="582" rx="16" stroke="rgba(219, 201, 119, 0.3)" stroke-width="2" />

  <!-- Header / Brand -->
  <g transform="translate(80, 80)">
    <!-- Brand Mark Monogram -->
    <rect width="48" height="48" rx="10" fill="#1D3451" stroke="#DBC977" stroke-width="1.5"/>
    <circle cx="24" cy="24" r="10" stroke="#DBC977" stroke-width="1.5" stroke-dasharray="3 3"/>
    <circle cx="24" cy="24" r="4" fill="#0056AA"/>
    
    <text x="64" y="30" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="22" font-weight="800" letter-spacing="1">
      SUNDAWA
    </text>
    <text x="64" y="46" fill="#DBC977" font-family="'Montserrat', sans-serif" font-size="11" font-weight="600" letter-spacing="2">
      ENTERPRISE BANKING SUITE
    </text>
  </g>

  <!-- Status Chip -->
  <g transform="translate(900, 80)">
    <rect width="220" height="38" rx="19" fill="#15273A" stroke="#0056AA" stroke-width="1.5" />
    <circle cx="920" cy="99" r="4" fill="#147D64" />
    <text x="935" y="103" fill="#EBF3FC" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">
      ON-PREMISE READY
    </text>
  </g>

  <!-- Center Content -->
  <g transform="translate(80, 220)">
    <!-- Eyebrow -->
    <text x="0" y="0" fill="#DBC977" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="700" letter-spacing="3">
      AGENT BANKING DISTRIBUTION &amp; OPERATIONS PLATFORM
    </text>

    <!-- Main Title -->
    <text x="0" y="65" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="52" font-weight="900" letter-spacing="-1">
      LAKUPANDAI
    </text>

    <!-- Headline Tagline with Gold -->
    <text x="0" y="130" fill="#FFFFFF" font-family="'Montserrat', sans-serif" font-size="34" font-weight="700">
      Perluas jangkauan layanan.
    </text>
    <text x="495" y="130" fill="url(#goldGradient)" font-family="'Montserrat', sans-serif" font-size="34" font-weight="800">
      Pertahankan kendali bank.
    </text>

    <!-- Description -->
    <text x="0" y="180" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="18" font-weight="400">
      Satu platform terintegrasi untuk mengoperasikan jaringan agen, kepastian transaksi,
    </text>
    <text x="0" y="210" fill="#94A3B8" font-family="'Montserrat', sans-serif" font-size="18" font-weight="400">
      likuiditas float, kepatuhan maker-checker, dan rekonsiliasi harian 4-kuadran.
    </text>
  </g>

  <!-- Bottom Feature Pills -->
  <g transform="translate(80, 510)">
    <!-- Pill 1 -->
    <rect x="0" y="0" width="220" height="36" rx="8" fill="#15273A" stroke="rgba(255,255,255,0.1)"/>
    <text x="16" y="23" fill="#DBC977" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ Maker-Checker Berlapis</text>

    <!-- Pill 2 -->
    <rect x="235" y="0" width="240" height="36" rx="8" fill="#15273A" stroke="rgba(255,255,255,0.1)"/>
    <text x="251" y="23" fill="#DBC977" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ Rekonsiliasi 4-Kuadran</text>

    <!-- Pill 3 -->
    <rect x="490" y="0" width="220" height="36" rx="8" fill="#15273A" stroke="rgba(255,255,255,0.1)"/>
    <text x="506" y="23" fill="#DBC977" font-family="'JetBrains Mono', monospace" font-size="12" font-weight="600">✓ On-Premise DC/DRC</text>
  </g>

  <!-- Footer Provider -->
  <text x="1120" y="533" text-anchor="end" fill="#64748B" font-family="'Montserrat', sans-serif" font-size="13" font-weight="500">
    Developed by <tspan fill="#CBD5E1" font-weight="700">PT Sundawa Teknologi Indonesia</tspan>
  </text>
</svg>
